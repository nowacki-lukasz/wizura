name: Build Wizura

# Bootstrap dla repo utworzonego z telefonu:
# 1) wgraj wizura-flutter.zip do katalogu głównego repo,
# 2) ten plik zapisz jako .github/workflows/build.yml.
# Efekt: APK w zakładce Releases (bezpośredni link do pobrania na telefon)
# oraz - jeśli repo jest publiczne - wersja web na GitHub Pages.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Rozpakuj projekt z ZIP-a
        run: |
          if [ -f wizura-flutter.zip ]; then unzip -oq wizura-flutter.zip; fi
          if [ -d wizura ]; then rsync -a wizura/ ./; fi
          test -f pubspec.yaml || { echo "Brak pubspec.yaml – wgraj wizura-flutter.zip"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.x"
          cache: true

      - run: flutter pub get

      - name: Testy (nie blokują builda)
        run: flutter test
        continue-on-error: true

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Zmień nazwę pliku
        run: cp build/app/outputs/flutter-apk/app-debug.apk wizura-debug.apk

      - name: Opublikuj APK w Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Wizura – build ${{ github.run_number }}
          body: "Debug APK zbudowany automatycznie. Pobierz wizura-debug.apk i zainstaluj na telefonie."
          files: wizura-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: wizura-debug-apk
          path: wizura-debug.apk

  web:
    # Wersja przeglądarkowa (GitHub Pages) – działa tylko dla repo publicznego
    # na darmowym koncie. Błąd tego joba nie wpływa na APK.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Rozpakuj projekt z ZIP-a
        run: |
          if [ -f wizura-flutter.zip ]; then unzip -oq wizura-flutter.zip; fi
          if [ -d wizura ]; then rsync -a wizura/ ./; fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.x"
          cache: true

      - name: Dodaj platformę web
        run: flutter create --platforms=web --org eu.neoteric --project-name wizura .

      - run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - id: deployment
        uses: actions/deploy-pages@v4
